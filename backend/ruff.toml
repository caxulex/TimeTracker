# ============================================
# TIME TRACKER - Ruff Configuration
# Fast Python linter and formatter
# ============================================

[lint]
# Enable pycodestyle, Pyflakes, and more
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DTZ003", # flake8-datetimez: ban datetime.utcnow()
    "DTZ005", # flake8-datetimez: ban datetime.now() without tz
]

ignore = [
    "E501",   # line too long - handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "W191",   # indentation contains tabs
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"tests/*" = ["B011", "S101", "DTZ003", "DTZ005"]  # Allow assert + naive UTC in tests
"__init__.py" = ["F401"]      # Allow unused imports in __init__.py
# Prompt 4b deferred sweep is now complete. All previously-listed files have
# been migrated to app.utils.timewindow.now_utc / day_bounds / range_bounds
# and DTZ003/DTZ005 apply uniformly across backend/app/.

[lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Like Black, respect magic trailing commas
# NOTE: `docstring-code-format = true` was removed because it requires
# ruff >= 0.3 and this project currently pins ruff 0.1.6. Restore the
# line once ruff is upgraded (tracked for the dependency-bump prompt).
