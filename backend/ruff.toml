# ============================================
# TIME TRACKER - Ruff Configuration
# Fast Python linter and formatter
# ============================================

[lint]
# Enable pycodestyle, Pyflakes, and more
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DTZ003", # flake8-datetimez: ban datetime.utcnow()
    "DTZ005", # flake8-datetimez: ban datetime.now() without tz
]

ignore = [
    "E501",   # line too long - handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "W191",   # indentation contains tabs
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"tests/*" = ["B011", "S101", "DTZ003", "DTZ005"]  # Allow assert + naive UTC in tests
"__init__.py" = ["F401"]      # Allow unused imports in __init__.py
# B6/B7/B9 / Prompt 4b deferred sweep. Each file below still contains
# datetime.utcnow() / naive datetime.now() call sites that are scheduled
# for migration in Prompt 4b. Rules DTZ003/DTZ005 are temporarily
# silenced per file (no globs per Modification 2) so 4a CI stays green.
# TODO(4b): remove each entry below once that file is migrated to
# app.utils.timewindow.now_utc / day_bounds / range_bounds.
